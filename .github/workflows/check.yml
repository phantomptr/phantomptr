# Every language has every string, and the scripts parse.
name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/site-i18n.mjs
      - run: node --check app.js && node --check shell.js
      - run: node -e "JSON.parse(require('fs').readFileSync('data/stats.json','utf8'))"
